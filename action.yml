name: "Maximize build disk space"
description: "Maximize the available disk space for your build job by removing unwanted software"
branding:
  icon: "crop"
  color: "blue"
inputs:
  remove-dotnet:
    description: "Removes .NET runtime and libraries"
    required: false
    default: "false"
  remove-android:
    description: "Removes Android SDKs and Tools"
    required: false
    default: "false"
  remove-haskell:
    description: "Removes Haskell runtime"
    required: false
    default: "false"
  remove-codeql:
    description: "Removes CodeQL Action Bundles"
    required: false
    default: "false"
  remove-large-packages:
    description: "Removes unwanted large Apt packages"
    required: false
    default: "false"
  remove-cached-tools:
    description: "Removes cached tools used by setup actions by GitHub"
    required: false
    default: "false"
  remove-swapfile:
    description: "Removes the Swapfile"
    required: false
    default: "false"
  remove-java:
    description: "Removes Java, Ant, Gradle and Maven"
    required: false
    default: "false"
  remove-swift:
    description: "Removes Swift toolchain"
    required: false
    default: "false"
  remove-julia:
    description: "Removes Julia"
    required: false
    default: "false"
  remove-browsers:
    description: "Removes Firefox, Chromium, Chrome and Edge"
    required: false
    default: "false"
  remove-cloud-tools:
    description: "Removes AWS CLI, Azure CLI and Google Cloud CLI"
    required: false
    default: "false"
  remove-kubernetes-tools:
    description: "Removes kubectl, helm, kind, minikube and kustomize"
    required: false
    default: "false"
  remove-powershell:
    description: "Removes PowerShell and modules"
    required: false
    default: "false"
  remove-container-tools:
    description: "Removes podman, buildah and skopeo"
    required: false
    default: "false"
  remove-rust:
    description: "Removes Rust, rustup and cargo"
    required: false
    default: "false"
  remove-python:
    description: "Removes pipx and conda (miniconda)"
    required: false
    default: "false"
  remove-node:
    description: "Removes Node.js"
    required: false
    default: "false"
  remove-go:
    description: "Removes Go language"
    required: false
    default: "false"
  remove-ruby:
    description: "Removes Ruby language"
    required: false
    default: "false"
  docker-cleanup:
    description: "Performs Docker system cleanup"
    required: false
    default: "false"
  set-tmpdir:
    description: "Sets TMPDIR environment variable to /mnt (only if /mnt is on a separate disk, e.g. ephemeral volume)"
    required: false
    default: "false"
  verbose:
    description: "Enables detailed logging of the action"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Warning on unsupported OS
      if: runner.os != 'Linux'
      shell: bash
      run: echo "::warning::Unsupported runner operation system, skipping cleanup"

    - name: Disk space report before modification
      if: runner.os == 'Linux'
      shell: bash
      env:
        VERBOSE: ${{ inputs.verbose }}
      run: |
        echo "==> Available space before cleanup"
        echo
        if [[ "$VERBOSE" == 'true' ]]; then
          df -BM
        else
          df -h
        fi

    - name: Maximize build disk space
      if: runner.os == 'Linux'
      shell: bash
      env:
        REMOVE_DOTNET: ${{ inputs.remove-dotnet }}
        REMOVE_ANDROID: ${{ inputs.remove-android }}
        REMOVE_HASKELL: ${{ inputs.remove-haskell }}
        REMOVE_CODEQL: ${{ inputs.remove-codeql }}
        REMOVE_CACHED_TOOLS: ${{ inputs.remove-cached-tools }}
        REMOVE_SWIFT: ${{ inputs.remove-swift }}
        REMOVE_JULIA: ${{ inputs.remove-julia }}
        REMOVE_RUST: ${{ inputs.remove-rust }}
        REMOVE_PYTHON: ${{ inputs.remove-python }}
        REMOVE_NODE: ${{ inputs.remove-node }}
        REMOVE_GO: ${{ inputs.remove-go }}
        REMOVE_RUBY: ${{ inputs.remove-ruby }}
        DOCKER_CLEANUP: ${{ inputs.docker-cleanup }}
        VERBOSE: ${{ inputs.verbose }}
        REMOVE_SWAPFILE: ${{ inputs.remove-swapfile }}
        REMOVE_JAVA: ${{ inputs.remove-java }}
        REMOVE_BROWSERS: ${{ inputs.remove-browsers }}
        REMOVE_CLOUD_TOOLS: ${{ inputs.remove-cloud-tools }}
        REMOVE_KUBERNETES_TOOLS: ${{ inputs.remove-kubernetes-tools }}
        REMOVE_POWERSHELL: ${{ inputs.remove-powershell }}
        REMOVE_CONTAINER_TOOLS: ${{ inputs.remove-container-tools }}
        REMOVE_LARGE_PACKAGES: ${{ inputs.remove-large-packages }}
        SET_TMPDIR: ${{ inputs.set-tmpdir }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        # Removes only the installed packages among the given names/globs, as apt-get fails on package names it doesn't know
        # (e.g. google-chrome-stable on arm64) and --ignore-missing doesn't change that
        remove_installed_dpkg() {
          local pkgs
          pkgs=$(dpkg --get-selections "$@" 2> /dev/null | grep -v deinstall | cut -f1 || true)
          if [[ -n "$pkgs" ]]; then
            sudo apt-get remove --autoremove -y $pkgs
          fi
        }

        echo "Removing unwanted software... "

        dirs_to_remove=""
        if [[ "$REMOVE_DOTNET" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/share/dotnet"
        fi
        if [[ "$REMOVE_ANDROID" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/local/lib/android"
        fi
        if [[ "$REMOVE_HASKELL" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/ghc /usr/local/.ghcup"
        fi
        if [[ "$REMOVE_CODEQL" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/hostedtoolcache/CodeQL"
        fi
        if [[ "$REMOVE_CACHED_TOOLS" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove ${RUNNER_TOOL_CACHE:-}"
        fi
        if [[ "$REMOVE_SWIFT" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/share/swift"
        fi
        if [[ "$REMOVE_JULIA" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/local/julia*"
        fi
        if [[ "$REMOVE_RUST" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /etc/skel/.rustup /etc/skel/.cargo /home/runner/.rustup /home/runner/.cargo"
        fi
        if [[ "$REMOVE_PYTHON" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/pipx /opt/pipx_bin /usr/share/miniconda /usr/bin/conda"
        fi
        if [[ "$REMOVE_NODE" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/node/"
        fi
        if [[ "$REMOVE_GO" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/go"
        fi
        if [[ "$REMOVE_RUBY" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /opt/Ruby"
        fi

        # Docker Cleanup
        if [[ "$DOCKER_CLEANUP" == 'true' ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Docker cleanup"
            sudo docker image prune --all --force
            sudo docker builder prune --all --force
            echo "::endgroup::"
          else
            sudo docker image prune --all --force > /dev/null
            sudo docker builder prune --all --force > /dev/null
          fi
        fi

        # Swapfile removal
        if [[ "$REMOVE_SWAPFILE" == 'true' ]]; then
          # Find the swap files before disabling swap; `swapon --show` only lists the active swap areas
          swapfiles=$(swapon --noheadings --raw --show=NAME,TYPE | awk '$2 == "file" { print $1 }' || true)
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing swapfile"
            sudo swapoff -a
            for swapfile in $swapfiles; do
              sudo eatmydata rm -f -v "$swapfile"
            done
            echo "::endgroup::"
          else
            sudo swapoff -a
            for swapfile in $swapfiles; do
              sudo eatmydata rm -f "$swapfile"
            done
          fi
        fi

        # Java removal
        if [[ "$REMOVE_JAVA" == 'true' ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing Java"
            remove_installed_dpkg 'temurin-*-jdk' ant ant-optional
            echo "::endgroup::"
          else
            remove_installed_dpkg 'temurin-*-jdk' ant ant-optional > /dev/null
          fi
          dirs_to_remove="$dirs_to_remove /usr/lib/jvm /usr/share/apache-maven-* /usr/share/gradle-*"
        fi

        # Browser removal (apt + directories)
        if [[ "$REMOVE_BROWSERS" == 'true' ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing browsers"
            remove_installed_dpkg google-chrome-stable microsoft-edge-stable firefox
            echo "::endgroup::"
          else
            remove_installed_dpkg google-chrome-stable microsoft-edge-stable firefox > /dev/null
          fi
          dirs_to_remove="$dirs_to_remove /usr/lib/firefox /usr/local/share/gecko_driver /usr/local/share/chromium /opt/microsoft /opt/google /usr/local/share/chromedriver-linux64 /usr/local/share/edge_driver /usr/bin/chromium /usr/bin/chromium-browser"
        fi

        # Cloud tools removal (directories + apt)
        if [[ "$REMOVE_CLOUD_TOOLS" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/local/bin/aws /usr/local/bin/aws_completer /usr/local/bin/sam /usr/local/bin/azcopy /usr/lib/google-cloud-sdk"
          # Remove cloud CLIs via apt
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing cloud tools"
            remove_installed_dpkg azure-cli 'google-cloud-*' 'gcloud-*' session-manager-plugin
            echo "::endgroup::"
          else
            remove_installed_dpkg azure-cli 'google-cloud-*' 'gcloud-*' session-manager-plugin > /dev/null
          fi
        fi

        # Kubernetes tools removal
        if [[ "$REMOVE_KUBERNETES_TOOLS" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/bin/kubectl* /usr/local/bin/kind /usr/local/bin/minikube /usr/local/bin/kustomize /usr/local/bin/helm"
          # Remove kubectl via apt
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing Kubernetes tools"
            remove_installed_dpkg kubectl
            echo "::endgroup::"
          else
            remove_installed_dpkg kubectl > /dev/null
          fi
        fi

        # PowerShell removal
        if [[ "$REMOVE_POWERSHELL" == 'true' ]]; then
          dirs_to_remove="$dirs_to_remove /usr/share/Az_* /usr/share/PowerShellGet* /usr/local/share/powershell"
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing PowerShell"
            remove_installed_dpkg powershell
            echo "::endgroup::"
          else
            remove_installed_dpkg powershell > /dev/null
          fi
        fi

        # Container tools removal (apt only)
        if [[ "$REMOVE_CONTAINER_TOOLS" == 'true' ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing container tools"
            remove_installed_dpkg podman buildah skopeo containernetworking-plugins
            echo "::endgroup::"
          else
            remove_installed_dpkg podman buildah skopeo containernetworking-plugins > /dev/null
          fi
        fi

        # Remove directories and files using eatmydata for faster deletion
        if [[ -n "$dirs_to_remove" ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing directories"
            printf '%s\n' $dirs_to_remove | xargs -I {} sudo eatmydata rm -rf -v {}
            echo "::endgroup::"
          else
            printf '%s\0' $dirs_to_remove | sudo xargs -0 -n1 -P4 eatmydata rm -rf
          fi
        fi

        # Large packages removal (apt only)
        if [[ "$REMOVE_LARGE_PACKAGES" == 'true' ]]; then
          if [[ "$VERBOSE" == 'true' ]]; then
            echo "::group::Removing large packages"
            remove_installed_dpkg 'aspnetcore-*' 'dotnet-*' 'llvm-*' '*php*' 'mongodb-*' 'mysql-*' mono-devel libgl1-mesa-dri
            sudo apt-get clean
            echo "::endgroup::"
          else
            remove_installed_dpkg 'aspnetcore-*' 'dotnet-*' 'llvm-*' '*php*' 'mongodb-*' 'mysql-*' mono-devel libgl1-mesa-dri > /dev/null
            sudo apt-get clean > /dev/null
          fi
        fi

        if [[ "$SET_TMPDIR" == 'true' ]]; then
          # Setting TMPDIR=/mnt only helps if it is a separate disk and have more free space than the current one
          current_tmpdir="${TMPDIR:-/tmp}"
          skip_reason=''
          if [[ ! -d /mnt ]]; then
            skip_reason='/mnt does not exist'
          elif [[ "$(stat -c %d /mnt)" == "$(stat -c %d "$current_tmpdir")" ]]; then
            skip_reason="/mnt is on the same disk as the current TMPDIR ($current_tmpdir)"
          else
            mnt_free=$(df -B1 --output=avail /mnt | tail -n 1)
            tmp_free=$(df -B1 --output=avail "$current_tmpdir" | tail -n 1)
            if (( mnt_free <= tmp_free )); then
              skip_reason="/mnt has less free space than the current TMPDIR ($current_tmpdir)"
            fi
          fi
          if [[ -n "$skip_reason" ]]; then
            echo "::warning::$skip_reason, TMPDIR left unchanged"
          else
            sudo chmod 1777 /mnt
            echo "TMPDIR=/mnt" >> $GITHUB_ENV
          fi
        fi
        echo "... done"

    - name: Disk space report after modification
      if: runner.os == 'Linux'
      shell: bash
      env:
        VERBOSE: ${{ inputs.verbose }}
      run: |
        echo "==> Available space after cleanup"
        echo
        if [[ "$VERBOSE" == 'true' ]]; then
          df -BM
        else
          df -h
        fi
